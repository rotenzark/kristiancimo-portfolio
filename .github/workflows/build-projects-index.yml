name: Build projects index

# Rebuilds everything DERIVED from data/projects/<slug>/index.json:
#
#   data/projects.json         the list the site reads
#   work/<slug>/index.html     one page per published project, with its own
#                              <title>, description and OG tags — social crawlers
#                              do not run JavaScript, so those must be in the HTML
#   sitemap.xml                published projects only, never a draft
#
# The work is done by tools/build.js, which you can also run locally with
# `node tools/build.js` — same script, same output, nothing to install.
# project.html is the template the pages come from, so editing it also rebuilds.

on:
  # Manual trigger — shows a "Run workflow" button in the Actions tab
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/projects/**"
      - "project.html"
      - "tools/build.js"
      - ".github/workflows/build-projects-index.yml"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history: sitemap <lastmod> is each project's last commit date
          fetch-depth: 0

      - name: Rebuild index, project pages and sitemap
        run: node tools/build.js

      - name: Commit generated files (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/projects.json work sitemap.xml
          git diff --cached --quiet && echo "nothing to rebuild" || {
            git commit -m "chore: rebuild projects index, project pages and sitemap"
            git push
          }
