<script type="module">
  import { videoEmbed, fixDeep, mediaBaseFor } from '/js/paths.js';

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function slug(s) {
    return String(s || '').toLowerCase()
      .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '');
  }
  function bind(key, value) {
    if (value == null) return;
    document.querySelectorAll(`[data-bind="${key}"]`).forEach(el => el.textContent = value);
  }
  function getParam(name) {
    return new URL(window.location.href).searchParams.get(name);
  }
  function hideLoader() {
    setTimeout(() => document.getElementById('loader').classList.add('gone'), 1200);
  }

  /* cursor */
  const cursor = document.getElementById('cursor');
  let cx = 0, cy = 0, tx = 0, ty = 0;
  window.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
  function cursorLoop() {
    cx += (tx - cx) * 0.2;
    cy += (ty - cy) * 0.2;
    cursor.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
    requestAnimationFrame(cursorLoop);
  }
  cursorLoop();
  function bindCursor() {
    document.querySelectorAll('.interactive, a, button').forEach(el => {
      if (el.dataset.cursorBound) return;
      el.dataset.cursorBound = '1';
      el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });
  }
  bindCursor();

  function setupReveals() {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -80px 0px' });
    document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => io.observe(el));
  }

  /* IMAGE before/after slider */
  function setupBA(container) {
    const clip = container.querySelector('.ba-clip');
    const handle = container.querySelector('.ba-handle');
    const imgBefore = container.querySelector('.ba-img.before');

    /* set container aspect ratio + container-width var, based on the natural image dimensions */
    function syncDimensions() {
      const w = imgBefore.naturalWidth, h = imgBefore.naturalHeight;
      if (!w || !h) return;
      const ratio = w / h;
      container.style.aspectRatio = `${w} / ${h}`;
      if (ratio < 0.85) container.setAttribute('data-orient', 'portrait');
      else if (ratio < 1.2) container.setAttribute('data-orient', 'square');
      else container.setAttribute('data-orient', 'landscape');
      // keep the "after" image scaled to the container, not viewport
      const updateContainerW = () => {
        container.style.setProperty('--container-w', container.clientWidth + 'px');
      };
      updateContainerW();
      window.addEventListener('resize', updateContainerW);
    }
    if (imgBefore.complete && imgBefore.naturalWidth) syncDimensions();
    else imgBefore.addEventListener('load', syncDimensions, { once: true });

    let dragging = false;
    function setBA(pct) {
      pct = Math.max(0, Math.min(100, pct));
      clip.style.width = pct + '%';
      handle.style.left = pct + '%';
    }
    function move(e) {
      if (!dragging) return;
      const rect = container.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      setBA((x / rect.width) * 100);
    }
    container.addEventListener('mousedown', e => { dragging = true; move(e); });
    container.addEventListener('touchstart', e => { dragging = true; move(e); }, { passive: true });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: true });
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('touchend', () => dragging = false);
    container.addEventListener('click', e => {
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      setBA((x / rect.width) * 100);
    });
    setBA(50);
  }

  /* VIDEO before/after slider */
  function setupVBA(container) {
    const wrap = container.querySelector('.vba-after-wrap');
    const handle = container.querySelector('.vba-handle');
    const videoBefore = container.querySelector('.vba-before-wrap video');
    const videoAfter = container.querySelector('.vba-after-wrap video');
    const playBtn = container.querySelector('.vba-playbtn');

    /* set container aspect ratio + container-width var from video metadata */
    function syncDimensions() {
      const w = videoBefore.videoWidth, h = videoBefore.videoHeight;
      if (!w || !h) return;
      const ratio = w / h;
      container.style.aspectRatio = `${w} / ${h}`;
      if (ratio < 0.85) container.setAttribute('data-orient', 'portrait');
      else if (ratio < 1.2) container.setAttribute('data-orient', 'square');
      else container.setAttribute('data-orient', 'landscape');
      const updateContainerW = () => {
        container.style.setProperty('--container-w', container.clientWidth + 'px');
      };
      updateContainerW();
      window.addEventListener('resize', updateContainerW);
    }
    if (videoBefore.readyState >= 1 && videoBefore.videoWidth) syncDimensions();
    else videoBefore.addEventListener('loadedmetadata', syncDimensions, { once: true });

    /* ── SHOW FIRST FRAME AS POSTER (mobile especially) ──────────────
       With preload alone, mobile browsers (iOS Safari) show a black box
       until play. Seeking to a tiny timestamp forces the browser to
       decode and paint that frame, so the video shows its first frame
       at rest — no need to press play to see something. */
    function seekToFirstFrame(video) {
      const doSeek = () => {
        try {
          // seek a hair past 0 so a frame is guaranteed to be decoded
          if (video.currentTime < 0.05) video.currentTime = 0.06;
        } catch (e) { /* ignore */ }
      };
      if (video.readyState >= 2) doSeek();
      else video.addEventListener('loadeddata', doSeek, { once: true });
    }
    // ── LOAD BOTH CLIPS INTO MEMORY (blob), then play from RAM ──────────
    // Why not just preload? A plain fetch-preload and the <video> element make
    // SEPARATE requests for the same file (a full GET vs. the video's Range
    // requests), and the browser won't reliably reuse one for the other — so
    // the clip re-downloads the moment you hit Play (that's the reload you see
    // in the Network tab). Instead we fetch each file ONCE, keep it in memory
    // as a Blob, and point the <video> at a blob: URL. From then on Play reads
    // straight from RAM: no network request, no reload, and RAW/EDIT start in
    // perfect lockstep because both are fully buffered. The <video> tags use
    // preload="none" so they never fire their own duplicate download.
    let preloadDone = false;
    function markReady() {
      if (preloadDone) return;
      if (videoBefore.readyState >= 4 && videoAfter.readyState >= 4) {
        preloadDone = true;
        playBtn.classList.add('ready');
      }
    }
    [videoBefore, videoAfter].forEach(v => {
      v.addEventListener('canplaythrough', markReady);
      v.addEventListener('progress', markReady);
    });

    let blobsRequested = false;
    function loadIntoMemory() {
      if (blobsRequested) return;               // only once per comparison
      blobsRequested = true;
      [videoBefore, videoAfter].forEach(v => {
        const url = v.getAttribute('src');
        if (!url || url.startsWith('blob:')) return;
        fetch(url)                              // same-origin → a usable Blob
          .then(r => r.blob())
          .then(blob => {
            // The object URL is deliberately NOT revoked. Revoking it on loadeddata
            // was tried on 2026-07-25 and taken back out: the element still needs the
            // URL every time it seeks — the loop restart and the drift correction both
            // seek — and a revoked URL there is a stall with no error. The only thing
            // revoking bought was releasing the URL→blob mapping, which the page frees
            // on unload anyway; not worth the risk of a video that stops mid-play.
            v.src = URL.createObjectURL(blob);  // video now reads from memory
            v.load();
            seekToFirstFrame(v);                // paint the first frame
            markReady();
          })
          .catch(() => {                         // network hiccup: fall back to streaming
            v.preload = 'auto';
            seekToFirstFrame(v);
          });
      });
    }

    // Pull the clips into memory only when the comparison is near the screen —
    // keeps the initial page load light (important on mobile, where loading
    // every before/after at once would mean tens of MB up front).
    if ('IntersectionObserver' in window) {
      const memIO = new IntersectionObserver((entries, obs) => {
        entries.forEach(en => {
          if (en.isIntersecting) { loadIntoMemory(); obs.disconnect(); }
        });
      }, { rootMargin: '400px' });              // start a little before it enters view
      memIO.observe(container);
    } else {
      loadIntoMemory();                          // old browser: just load now
    }

    let dragging = false;
    function setVBA(pct) {
      pct = Math.max(0, Math.min(100, pct));
      wrap.style.width = pct + '%';
      handle.style.left = pct + '%';
    }
    function move(e) {
      if (!dragging) return;
      const rect = container.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      setVBA((x / rect.width) * 100);
    }
    container.addEventListener('mousedown', e => {
      if (e.target.closest('.vba-playbtn')) return;
      dragging = true; move(e);
    });
    container.addEventListener('touchstart', e => {
      if (e.target.closest('.vba-playbtn')) return;
      dragging = true; move(e);
    }, { passive: true });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: true });
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('touchend', () => dragging = false);

    let playing = false;

    // Play both, aligned. The trick for smooth sync: align ONCE at start,
    // start both, and DON'T seek during playback (seeking mid-play stutters
    // the video). We only nudge the "after" video back if it drifts a lot,
    // and we do it rarely, not every frame.
    function startTogether() {
      // Align once here, while both are still paused — this is the one safe moment
      // to seek. From here on the two are kept together by speed, never by seeking.
      videoAfter.currentTime = videoBefore.currentTime;
      videoBefore.playbackRate = 1;
      videoAfter.playbackRate = 1;
      const p1 = videoBefore.play();
      const p2 = videoAfter.play();
      // both play() calls fire back-to-back synchronously here, which is the
      // closest to simultaneous the browser allows
      Promise.all([p1, p2].map(p => p && p.catch(() => {})));
      playBtn.textContent = '❚❚ Pause';
    }

    function stopBoth() {
      videoBefore.pause();
      videoAfter.pause();
      videoAfter.playbackRate = 1;   // don't resume mid-correction next time
      playBtn.textContent = '▶ Play';
    }

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playing = !playing;
      if (playing) startTogether();
      else stopBoth();
    });

    /* Drift correction WITHOUT seeking.
     *
     * This used to set videoAfter.currentTime whenever the two drifted more than
     * 0.1s apart, every 500ms. Seeking a <video> mid-playback flushes its decoder,
     * so each correction cost more drift than it repaired: the clip fell further
     * behind, the next tick corrected again, and the two sawed against each other
     * until one stopped. "Starts, then freezes for no reason" was this loop.
     *
     * Nudging playbackRate instead lets the trailing clip catch up without ever
     * interrupting decode. 3% is imperceptible on a five-second loop.
     *
     * A seek survives for exactly one case: the loop wraps, or the tab came back
     * from the background, and the two are a second or more apart. Speed alone
     * would take too long to close a gap that size, and there is no playback to
     * protect at that point anyway.
     */
    setInterval(() => {
      if (!playing) return;
      if (videoBefore.paused || videoAfter.paused) return;
      const drift = videoAfter.currentTime - videoBefore.currentTime;
      const off = Math.abs(drift);
      if (off > 0.75) {
        videoAfter.currentTime = videoBefore.currentTime;
        videoAfter.playbackRate = 1;
      } else if (off > 0.035) {
        videoAfter.playbackRate = drift > 0 ? 0.97 : 1.03;
      } else if (videoAfter.playbackRate !== 1) {
        videoAfter.playbackRate = 1;
      }
    }, 250);

    setVBA(50);
  }

  /* ─── HELPERS to render sub-blocks ─── */

  // Detects a video file by extension (used to render <video> instead of <img>)
  function isVideoFile(url) {
    if (!url) return false;
    return /\.(mp4|webm|mov|m4v|ogv)($|\?)/i.test(url);
  }

  function renderGalleryBlock(block, idx, total) {
    if (!block) return '';
    const images = (block.images || []).filter(Boolean);
    if (!images.length) return '';
    const tag = block.tag ? `<span class="tag">${escapeHtml(block.tag)}</span>` : '';
    const heading = block.heading ? `<h3>${escapeHtml(block.heading)}</h3>` : '';
    const caption = block.caption ? `<p>${escapeHtml(block.caption)}</p>` : '';
    const head = (tag || heading || caption) ? `
      <div class="gallery-block-head">
        ${tag}
        ${heading}
        ${caption}
      </div>
    ` : '';
    const count = images.length;
    const countClass = count === 1 ? 'count-1' : '';
    return `
      <div class="gallery-block reveal">
        ${head}
        <div class="p-gallery ${countClass}">
          ${images.map(img => {
            const src = typeof img === 'string' ? img : img.src;
            const alt = typeof img === 'string' ? '' : (img.alt || '');
            if (isVideoFile(src)) {
              return `<div class="item is-video">
                <video src="${escapeHtml(src)}" autoplay muted loop playsinline preload="auto" data-needs-orient="1"></video>
              </div>`;
            }
            return `<div class="item"><img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy" data-needs-orient="1"></div>`;
          }).join('')}
        </div>
      </div>
    `;
  }

  /* Set each item's flex-grow proportional to its aspect ratio so that
     images on the same row end up sharing the same height (justified rows).
     Works for both .p-gallery blocks and .story-images.multi blocks.
     Runs once per image (on load) and re-runs on window resize. */
  function applyJustifiedRow(container, items) {
    // On mobile the gallery stacks vertically (CSS handles it); the justified-row
    // math is desktop-only. Running it on mobile sets flex-basis:0 which collapses
    // images to zero height. So bail out on narrow screens.
    if (window.matchMedia('(max-width: 900px)').matches) return;
    items.forEach(item => {
      const media = item.querySelector('img, video');
      if (!media) return;
      const isVid = media.tagName === 'VIDEO';
      const apply = () => {
        const w = isVid ? media.videoWidth : media.naturalWidth;
        const h = isVid ? media.videoHeight : media.naturalHeight;
        if (!w || !h) return;
        const ratio = w / h;
        let orient = 'landscape';
        if (ratio < 0.85) orient = 'portrait';
        else if (ratio < 1.2) orient = 'square';
        else if (ratio > 2.2) orient = 'wide';
        item.setAttribute('data-orient', orient);
        item.style.flexGrow = ratio.toFixed(3);
        item.style.flexBasis = '0';
        const minW = Math.max(140, Math.round(ratio * 180));
        item.style.minWidth = minW + 'px';
        media.removeAttribute('data-needs-orient');
      };
      if (isVid) {
        if (media.readyState >= 1 && media.videoWidth) apply();
        else media.addEventListener('loadedmetadata', apply, { once: true });
      } else {
        if (media.complete && media.naturalWidth) apply();
        else media.addEventListener('load', apply, { once: true });
      }
    });
  }

  function detectOrientations() {
    // Gallery blocks
    document.querySelectorAll('.p-gallery').forEach(gallery => {
      const items = Array.from(gallery.querySelectorAll('.item'));
      if (!items.length) return;
      if (gallery.classList.contains('count-1')) return; // skip single-image blocks
      applyJustifiedRow(gallery, items);
    });
    // Storytelling image containers with multiple images
    document.querySelectorAll('.story-images.multi').forEach(container => {
      const items = Array.from(container.querySelectorAll('.item'));
      if (!items.length) return;
      applyJustifiedRow(container, items);
    });
  }

  /* ─── LIGHTBOX: click any gallery image to open it fullscreen ─── */
  function setupLightbox() {
    // Build lightbox once and reuse
    let box = document.querySelector('.lightbox');
    if (!box) {
      box = document.createElement('div');
      box.className = 'lightbox';
      box.innerHTML = `
        <button class="lightbox-close interactive" aria-label="Close">✕</button>
        <img alt="" hidden>
        <video controls playsinline hidden></video>
      `;
      document.body.appendChild(box);
    }
    const boxImg = box.querySelector('img');
    const boxVid = box.querySelector('video');
    const closeBtn = box.querySelector('.lightbox-close');

    function openImage(src, alt) {
      boxVid.hidden = true; boxVid.pause(); boxVid.removeAttribute('src'); boxVid.load();
      boxImg.hidden = false;
      boxImg.src = src;
      boxImg.alt = alt || '';
      box.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function openVideo(src) {
      boxImg.hidden = true; boxImg.src = '';
      boxVid.hidden = false;
      boxVid.src = src;
      boxVid.currentTime = 0;
      boxVid.play().catch(() => {});
      box.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function close() {
      box.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => {
        if (!box.classList.contains('open')) {
          boxImg.src = '';
          if (!boxVid.paused) boxVid.pause();
          boxVid.removeAttribute('src'); boxVid.load();
        }
      }, 400);
    }

    // Click on gallery items or storytelling items opens the lightbox
    document.querySelectorAll('.p-gallery .item, .story-images .item').forEach(item => {
      if (item.dataset.lightboxBound) return;
      item.dataset.lightboxBound = '1';
      item.addEventListener('click', () => {
        const vid = item.querySelector('video');
        if (vid) return openVideo(vid.currentSrc || vid.src);
        const img = item.querySelector('img');
        if (img) return openImage(img.src, img.alt);
      });
    });

    // Close on background click, close button, or Escape key
    box.addEventListener('click', e => {
      if (e.target === box || e.target === closeBtn) close();
    });
    if (!box.dataset.keyBound) {
      box.dataset.keyBound = '1';
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && box.classList.contains('open')) close();
      });
    }
  }

  function renderVideoBlock(block, idx, total) {
    if (!block) return '';
    const file = block.file || block.videoFile;
    const url = block.url;
    if (!file && !url) return '';
    const tag = block.tag ? `<span class="tag">${escapeHtml(block.tag)}</span>` : '';
    const heading = block.heading ? `<h3>${escapeHtml(block.heading)}</h3>` : '';
    const caption = block.caption ? `<p>${escapeHtml(block.caption)}</p>` : '';
    const head = (tag || heading || caption) ? `
      <div class="video-block-head">
        ${tag}
        ${heading}
        ${caption}
      </div>
    ` : '';
    let media;
    if (file) {
      media = `<video src="${escapeHtml(file)}" controls playsinline preload="auto"></video>`;
    } else {
      const embed = videoEmbed(url);
      media = embed
        ? `<iframe src="${escapeHtml(embed)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`
        : `<video src="${escapeHtml(url)}" controls playsinline></video>`;
    }
    return `
      <div class="video-block reveal">
        ${head}
        <div class="p-video">
          ${media}
        </div>
      </div>
    `;
  }

  function renderImageBA(block, idx, total) {
    if (!block || (!block.imageBefore && !block.imageAfter)) return '';
    const numLabel = total > 1 ? `<span class="num">${String(idx + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}</span>` : '';
    const head = (block.title || total > 1) ? `
      <div class="ba-block-head">
        <span class="title">${escapeHtml(block.title || `Shot ${idx + 1}`)}</span>
        ${numLabel}
      </div>
    ` : '';
    return `
      <div class="ba-block reveal">
        ${head}
        <div class="p-ba interactive">
          <img class="ba-img before" src="${escapeHtml(block.imageBefore || block.imageAfter)}" alt="Raw plate" loading="lazy">
          <div class="ba-clip">
            <img class="ba-img after" src="${escapeHtml(block.imageAfter || block.imageBefore)}" alt="Final composite" loading="lazy">
          </div>
          <div class="ba-labels">
            <span class="before">${escapeHtml(block.labelBefore || 'Raw Plate')}</span>
            <span class="after">${escapeHtml(block.labelAfter || 'Final CGI')}</span>
          </div>
          <div class="ba-handle"><div class="ba-knob">⇄</div></div>
        </div>
      </div>
    `;
  }

  function renderVideoBA(block, idx, total) {
    if (!block || (!block.videoBefore && !block.videoAfter)) return '';
    const numLabel = total > 1 ? `<span class="num">${String(idx + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}</span>` : '';
    const head = (block.title || total > 1) ? `
      <div class="ba-block-head">
        <span class="title">${escapeHtml(block.title || `Shot ${idx + 1}`)}</span>
        ${numLabel}
      </div>
    ` : '';
    return `
      <div class="ba-block reveal">
        ${head}
        <div class="p-vba interactive">
          <div class="vba-before-wrap">
            <video src="${escapeHtml(block.videoBefore || block.videoAfter)}" muted loop playsinline preload="none"></video>
          </div>
          <div class="vba-after-wrap">
            <video src="${escapeHtml(block.videoAfter || block.videoBefore)}" muted loop playsinline preload="none"></video>
          </div>
          <div class="vba-labels">
            <span class="before">${escapeHtml(block.labelBefore || 'Raw Plate')}</span>
            <span class="after">${escapeHtml(block.labelAfter || 'Final CGI')}</span>
          </div>
          <div class="vba-handle"><div class="vba-knob">⇄</div></div>
          <button class="vba-playbtn">▶ Play</button>
        </div>
      </div>
    `;
  }

  /* ─── BACKWARD COMPAT: normalize old single fields → arrays ─── */
  function normalizeProject(p) {
    // Repair the media paths the CMS wrote (see js/paths.js for the why).
    const slugForMedia = p.slug || slug(p.title || '');
    p = fixDeep(p, mediaBaseFor(slugForMedia));

    // gallery: if it's a flat array of images (v2), wrap it in a single block
    let galleryBlocks = [];
    if (Array.isArray(p.galleryBlocks) && p.galleryBlocks.length) {
      galleryBlocks = p.galleryBlocks;
    } else if (Array.isArray(p.gallery) && p.gallery.length) {
      galleryBlocks = [{ images: p.gallery }];
    }

    // VIDEOS: support both `videoBlocks` (v3.1, array) and `videoUrl` + `videoCaption` (v2/v3, single)
    let videoBlocks = [];
    if (Array.isArray(p.videoBlocks) && p.videoBlocks.length) {
      videoBlocks = p.videoBlocks;
    } else if (p.videoUrl) {
      videoBlocks = [{ url: p.videoUrl, caption: p.videoCaption || '' }];
    }

    // image before/after: support both `beforeAfter` (single, v2) and `beforeAfters` (array, v3)
    let imageBAs = [];
    if (Array.isArray(p.beforeAfters) && p.beforeAfters.length) {
      imageBAs = p.beforeAfters;
    } else if (p.beforeAfter && (p.beforeAfter.imageBefore || p.beforeAfter.imageAfter)) {
      imageBAs = [p.beforeAfter];
    }

    // video before/after: support both `videoBeforeAfter` (single, v2) and `videoBeforeAfters` (array, v3)
    let videoBAs = [];
    if (Array.isArray(p.videoBeforeAfters) && p.videoBeforeAfters.length) {
      videoBAs = p.videoBeforeAfters;
    } else if (p.videoBeforeAfter && (p.videoBeforeAfter.videoBefore || p.videoBeforeAfter.videoAfter)) {
      videoBAs = [p.videoBeforeAfter];
    }

    return { ...p, _galleryBlocks: galleryBlocks, _videoBlocks: videoBlocks, _imageBAs: imageBAs, _videoBAs: videoBAs };
  }

  /* The slug comes from the path on the generated pages (/work/<slug>/), and from
     ?id= on the legacy URL, which this file still serves directly at /project.
     Both must keep working: the old form is what search engines and any
     already-shared link may still be using.

     The generated pages live under work/, not project/, because a project/
     directory sitting next to project.html would make /project ambiguous. */
  function slugFromPath() {
    const m = window.location.pathname.match(/^\/work\/([^/]+)\/?$/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  async function renderProject() {
    const fromPath = slugFromPath();
    const id = fromPath || getParam('id');
    if (!id) { window.location.href = '/'; return; }

    let projects, footer, site;
    try {
      [projects, footer, site] = await Promise.all([
        fetch('/data/projects.json').then(r => r.json()),
        fetch('/data/footer.json').then(r => r.json()),
        fetch('/data/site.json').then(r => r.json())
      ]);
    } catch (err) {
      document.getElementById('project-root').innerHTML = `
        <section style="padding:200px 32px;text-align:center;">
          <h1 style="font-family:'Anton',sans-serif;font-size:64px;">Error loading project</h1>
          <p style="margin-top:24px;color:var(--muted);">${escapeHtml(String(err))}</p>
          <p style="margin-top:24px;"><a href="/" class="interactive" style="border-bottom:1px solid;">← Back to home</a></p>
        </section>`;
      hideLoader();
      return;
    }

    bind('status', site.status);

    // Draft projects are hidden from the public site (same filter as index.html).
    // Filtering here does double duty: an unpublished slug falls through to the 404
    // below, and the "Next Project" link can never point at a draft.
    const all = (projects.items || []).filter(p => !p.draft).sort((a,b) => (a.order||999) - (b.order||999));
    const idx = all.findIndex(p => (p.slug || slug(p.title)) === id);
    if (idx === -1) {
      document.getElementById('project-root').innerHTML = `
        <section style="padding:200px 32px;text-align:center;">
          <h1 style="font-family:'Anton',sans-serif;font-size:80px;">404</h1>
          <p style="margin-top:24px;color:var(--muted);">Project "${escapeHtml(id)}" not found</p>
          <p style="margin-top:24px;"><a href="/" class="interactive" style="border-bottom:1px solid;">← Back to home</a></p>
        </section>`;
      hideLoader();
      return;
    }

    // Legacy /project?id=<slug> → the canonical /work/<slug>/, which carries the
    // per-project meta tags. Deliberately AFTER the lookup above: an unknown or
    // unpublished slug keeps the styled 404 instead of being bounced to a page that
    // does not exist.
    if (!fromPath) {
      window.location.replace('/work/' + encodeURIComponent(id) + '/');
      return;
    }

    const p = normalizeProject(all[idx]);
    const next = all[(idx + 1) % all.length];

    document.title = `${p.title} — Kristian Cimò`;
    const root = document.getElementById('project-root');
    let html = '';

    /* HERO */
    const infoRows = [];
    if (p.client) infoRows.push(['Client', p.client]);
    if (p.talent) infoRows.push(['Talent', p.talent]);
    if (p.year) infoRows.push(['Year', p.year]);
    if (p.role) infoRows.push(['Role', p.role]);
    if (p.software) infoRows.push(['Software', p.software]);
    if (p.format) infoRows.push(['Format', p.format]);
    if (p.category) infoRows.push(['Category', p.category]);

    html += `
      <section class="project-hero reveal">
        <div class="project-hero-meta">
          <span>${escapeHtml(p.client || '—')}</span>
          <span class="sep">·</span>
          <span>${escapeHtml(p.year || '—')}</span>
          <span class="sep">·</span>
          <span>${escapeHtml(p.category || '—')}</span>
        </div>
        <h1 class="project-hero-title">${escapeHtml(p.title)}</h1>
        ${p.subtitle ? `<p class="project-hero-subtitle">${escapeHtml(p.subtitle)}</p>` : ''}
        ${infoRows.length ? `
          <div class="project-info-grid">
            ${infoRows.map(([k, v]) => `
              <div class="row"><span>${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>
            `).join('')}
          </div>` : ''}
        ${p.publicationUrl ? `
          <div class="project-publication">
            <a href="${escapeHtml(p.publicationUrl)}" target="_blank" rel="noopener noreferrer" class="publication-btn interactive">
              <span class="publication-btn-label">${escapeHtml(p.publicationLabel || 'View Publication')}</span>
              <span class="publication-btn-arrow" aria-hidden="true">→</span>
            </a>
          </div>` : ''}
      </section>
    `;

    /* COVER — project page hero
       Priority order (first non-empty wins):
       1. coverVideo (Vimeo/YouTube/direct file) — video hero
       2. insideCover (dedicated inside-page image, e.g. horizontal) — different from home tile
       3. image (the home tile image, fallback) */
    if (p.coverVideo) {
      const embed = videoEmbed(p.coverVideo);
      if (embed) {
        html += `<section class="project-cover"><iframe src="${escapeHtml(embed)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></section>`;
      } else {
        html += `<section class="project-cover"><video src="${escapeHtml(p.coverVideo)}" autoplay muted loop playsinline></video></section>`;
      }
    } else if (p.insideCover) {
      html += `<section class="project-cover"><img src="${escapeHtml(p.insideCover)}" alt="${escapeHtml(p.title)}"></section>`;
    } else if (p.image) {
      html += `<section class="project-cover"><img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.title)}"></section>`;
    }

    let sectionNum = 1;
    function head(title) {
      const n = String(sectionNum++).padStart(2, '0');
      return `
        <div class="p-section-head">
          <span><span class="num">${n}</span> &nbsp;/&nbsp; ${escapeHtml(title)}</span>
          <span>${escapeHtml(p.title)}</span>
        </div>
      `;
    }

    /* DESCRIPTION */
    if (p.description) {
      const paragraphs = p.description.split(/\n\n+/).filter(Boolean);
      html += `<section class="p-section reveal">
        ${head('Case Study')}
        <div class="p-description">
          ${paragraphs.map(t => `<p>${escapeHtml(t)}</p>`).join('')}
        </div>
      </section>`;
    }

    /* GALLERY (multi-block) */
    if (p._galleryBlocks.length) {
      html += `<section class="p-section">
        ${head('Gallery')}
        ${p._galleryBlocks.map((b, i) => renderGalleryBlock(b, i, p._galleryBlocks.length)).join('')}
      </section>`;
    }

    /* VIDEOS (multi-block) */
    if (p._videoBlocks.length) {
      html += `<section class="p-section">
        ${head('Videos')}
        ${p._videoBlocks.map((b, i) => renderVideoBlock(b, i, p._videoBlocks.length)).join('')}
      </section>`;
    }

    /* IMAGE BEFORE/AFTER (multi) */
    if (p._imageBAs.length) {
      html += `<section class="p-section">
        ${head('Before / After')}
        ${p._imageBAs.map((b, i) => renderImageBA(b, i, p._imageBAs.length)).join('')}
      </section>`;
    }

    /* VIDEO BEFORE/AFTER (multi) */
    if (p._videoBAs.length) {
      html += `<section class="p-section">
        ${head('Video Breakdown')}
        ${p._videoBAs.map((b, i) => renderVideoBA(b, i, p._videoBAs.length)).join('')}
      </section>`;
    }

    /* STORYTELLING */
    if (Array.isArray(p.storytelling) && p.storytelling.length) {
      html += `<section class="p-section">
        ${head('Process')}
        ${p.storytelling.map((item, i) => {
          // normalize: prefer new `images` array; fall back to old single `image`
          const pickSrc = x => (typeof x === 'string' ? x : (x && x.src) ? x.src : '');
          const media = Array.isArray(item.images) && item.images.length
            ? item.images.map(pickSrc).filter(Boolean)
            : (item.image ? [item.image] : []);
          const mediaTag = (src) =>
            isVideoFile(src)
              ? `<div class="item is-video"><video src="${escapeHtml(src)}" autoplay muted loop playsinline preload="auto" data-needs-orient="1"></video></div>`
              : `<div class="item"><img src="${escapeHtml(src)}" alt="${escapeHtml(item.heading || '')}" loading="lazy" data-needs-orient="1"></div>`;
          const imgsHTML = media.length === 1
            ? `<div class="story-images single">${mediaTag(media[0])}</div>`
            : media.length > 1
              ? `<div class="story-images multi">${media.map(src => mediaTag(src)).join('')}</div>`
              : '';
          return `
            <div class="p-story reveal ${i % 2 ? 'reverse' : ''}">
              <div class="img">${imgsHTML}</div>
              <div class="text">
                ${item.heading ? `<h3>${escapeHtml(item.heading)}</h3>` : ''}
                ${item.text ? `<p>${escapeHtml(item.text)}</p>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </section>`;
    }

    /* CREDITS */
    if (Array.isArray(p.credits) && p.credits.length) {
      html += `<section class="p-section reveal">
        ${head('Credits')}
        <div class="p-credits">
          ${p.credits.map(c => `<div class="credit-row"><span>${escapeHtml(c.role)}</span><span>${escapeHtml(c.name)}</span></div>`).join('')}
        </div>
      </section>`;
    }

    /* NEXT PROJECT */
    if (p.showNextProject !== false && next && next !== all[idx]) {
      const nextId = next.slug || slug(next.title);
      html += `
        <a href="/work/${encodeURIComponent(nextId)}/" class="next-project interactive">
          <div class="label">Next Project — ${escapeHtml(next.year || '')}</div>
          <h2>${escapeHtml(next.title)}</h2>
          <div class="arrow">→ View</div>
        </a>
      `;
    }

    root.innerHTML = html;

    document.querySelectorAll('.p-ba').forEach(el => setupBA(el));
    document.querySelectorAll('.p-vba').forEach(el => setupVBA(el));
    detectOrientations();
    setupLightbox();

    /* footer */
    document.getElementById('contact-cta').innerHTML = `
      ${escapeHtml(footer.ctaLine1)}<br>${escapeHtml(footer.ctaLine2)}<br>${escapeHtml(footer.ctaLine3Pre)} <span class="em">${escapeHtml(footer.ctaLine3Em)}</span><br>
      <a href="mailto:${escapeHtml(footer.email)}" class="interactive">${escapeHtml(footer.email)} →</a>
    `;
    document.getElementById('footer-grid').innerHTML = `
      <div class="col">
        <h4>Contact</h4>
        <a href="mailto:${escapeHtml(footer.email)}" class="interactive">${escapeHtml(footer.email)}</a>
      </div>
      <div class="col">
        <h4>Social</h4>
        ${(footer.social || []).map(s =>
          `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener" class="interactive">${escapeHtml(s.label)}</a>`
        ).join('')}
      </div>
      <div class="col">
        <h4>Index</h4>
        <a href="/#work" class="interactive">Work</a>
        <a href="/#about" class="interactive">About</a>
        <a href="/#contact" class="interactive">Contact</a>
      </div>
      <div class="col">
        <h4>Studio</h4>
        <span>Milano · Italia</span>
        <span>Remote Worldwide</span>
        <span>EU · GMT+1</span>
      </div>
    `;

    bindCursor();
    setupReveals();
    hideLoader();
  }

  renderProject();
</script>

</body>
</html>
